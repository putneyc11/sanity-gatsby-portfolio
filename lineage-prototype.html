<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Lineage — Prototype</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0D1117;
  --surface:#161B22;
  --surface-2:#1C2128;
  --surface-3:#21262D;
  --border:#30363D;
  --border-light:#21262D;
  --text:#E6EDF3;
  --text-muted:#7D8590;
  --text-dim:#484F58;
  --blue:#388BFD;
  --purple:#A371F7;
  --cyan:#39C5CF;
  --green:#3FB950;
  --amber:#E3B341;
  --red:#F85149;
}

body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column}

/* ── TOP BAR ── */
#top-bar{height:52px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;z-index:100}
.logo{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo-mark{width:26px;height:26px;background:linear-gradient(135deg,#388BFD,#A371F7);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:700}
.vr{width:1px;height:24px;background:var(--border);flex-shrink:0}
.breadcrumb{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-muted);white-space:nowrap}
.breadcrumb .bc-item{cursor:pointer;transition:color .1s}.breadcrumb .bc-item:hover{color:var(--text)}
.breadcrumb .bc-sep{color:var(--text-dim)}
.breadcrumb .bc-cur{color:var(--text);font-weight:500}

#search-wrap{position:relative;flex:1;max-width:380px;margin:0 auto}
#search-input{width:100%;height:34px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:0 12px 0 34px;color:var(--text);font-size:13px;outline:none;transition:border-color .15s}
#search-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(56,139,253,.1)}
#search-input::placeholder{color:var(--text-dim)}
.search-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:14px;pointer-events:none}
.kbd{display:inline-flex;align-items:center;justify-content:center;position:absolute;right:8px;top:50%;transform:translateY(-50%);background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:10px;color:var(--text-dim);pointer-events:none;transition:opacity .15s}
#search-input:focus ~ .kbd{opacity:0}

#search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;overflow:hidden;z-index:2000;display:none;box-shadow:0 8px 32px rgba(0,0,0,.5)}
#search-results.open{display:block}
.sr-group-label{padding:8px 12px 4px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim)}
.sr-item{padding:7px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;transition:background .1s}
.sr-item:hover,.sr-item.focused{background:rgba(56,139,253,.12)}
.sr-item .sr-badge{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600;flex-shrink:0}
.sr-item .sr-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-item .sr-col{font-size:11px;color:var(--text-dim);font-family:monospace;flex-shrink:0}
.sr-empty{padding:16px 12px;font-size:13px;color:var(--text-dim);text-align:center}

.chips{display:flex;gap:5px;margin-left:auto;flex-shrink:0}
.chip{height:26px;padding:0 10px;border-radius:13px;border:1px solid var(--border);background:transparent;color:var(--text-muted);font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .15s;white-space:nowrap}
.chip:hover{border-color:var(--text-dim);color:var(--text)}
.chip.on{border-color:var(--blue);background:rgba(56,139,253,.12);color:var(--blue)}
.chip-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

/* ── LAYOUT ── */
#layout{flex:1;display:flex;overflow:hidden;position:relative}

/* ── LEFT PANEL ── */
#left-panel{width:216px;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column}
.lp-section{padding:10px 0;border-bottom:1px solid var(--border-light)}
.lp-title{padding:0 12px 6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim)}
.lp-node{padding:5px 12px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);cursor:pointer;border-radius:0;transition:background .1s;border-left:2px solid transparent}
.lp-node:hover{background:var(--surface-2);color:var(--text)}
.lp-node.active{background:rgba(56,139,253,.08);color:var(--blue);border-left-color:var(--blue)}
.lp-toggle{font-size:9px;width:10px;flex-shrink:0;text-align:center;color:var(--text-dim)}
.lp-count{margin-left:auto;font-size:10px;color:var(--text-dim);background:var(--surface-2);padding:1px 5px;border-radius:3px}
.lp-children{border-left:1px solid var(--border-light);margin-left:22px}
.lp-table-node{padding:4px 8px 4px 10px;display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-muted);cursor:pointer;transition:background .1s;border-left:2px solid transparent}
.lp-table-node:hover{background:var(--surface-2);color:var(--text)}
.lp-table-node.active{color:var(--blue);border-left-color:var(--blue)}
.lp-dot{width:5px;height:5px;border-radius:1px;flex-shrink:0}
.lp-stat{padding:3px 12px;display:flex;justify-content:space-between;font-size:12px}
.lp-stat .k{color:var(--text-muted)}.lp-stat .v{color:var(--text);font-weight:500}

/* ── GRAPH ── */
#graph-area{flex:1;position:relative;overflow:hidden;background:var(--bg);background-image:radial-gradient(circle at 1px 1px,#1C2128 1px,transparent 0);background-size:22px 22px;cursor:grab}
#graph-area.panning{cursor:grabbing}
#canvas{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
#edges-svg{position:absolute;top:0;left:0;pointer-events:none;overflow:visible}

/* layer column labels */
.layer-col{position:absolute;top:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:5px}
.layer-col-bar{width:1px;background:linear-gradient(to bottom,transparent,var(--border-light) 20%,var(--border-light) 80%,transparent);position:absolute;top:0;bottom:-40px;left:50%;transform:translateX(-50%);pointer-events:none;z-index:0}
.layer-col-label{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;background:var(--surface);border:1px solid var(--border);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;z-index:1;white-space:nowrap}

/* ── NODES ── */
.node{position:absolute;width:204px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;transform:translateX(-50%);transition:border-color .15s,box-shadow .15s,opacity .2s;z-index:2}
.node:hover{border-color:#484F58;box-shadow:0 2px 12px rgba(0,0,0,.4)}
.node.sel{border-color:var(--blue)!important;box-shadow:0 0 0 1px var(--blue),0 4px 20px rgba(56,139,253,.25)!important;z-index:10}
.node.hl{border-color:rgba(255,255,255,.2);box-shadow:0 2px 16px rgba(0,0,0,.5);z-index:5}
.node.dim{opacity:.2;pointer-events:none}

.node-head{padding:10px 10px 8px;display:flex;align-items:center;gap:7px}
.node-badge{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.node-name{font-size:12px;font-weight:600;color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:ui-monospace,'Cascadia Code','Fira Code',monospace}
.node-chevron{font-size:10px;color:var(--text-dim);padding:2px;transition:transform .2s;flex-shrink:0}
.node.expanded .node-chevron{transform:rotate(180deg)}

.node-meta{padding:0 10px 9px;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.node-tag{font-size:10px;color:var(--text-dim);background:var(--surface-2);padding:2px 5px;border-radius:4px;white-space:nowrap}
.node-freshness{width:6px;height:6px;border-radius:50%;flex-shrink:0}

.node-sep{height:1px;background:var(--border-light);margin:0 0}

/* Column rows inside expanded node */
.node-cols{padding:2px 0 4px}
.node-col-row{padding:5px 10px;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-muted);cursor:default;transition:background .1s}
.node-col-row:hover{background:rgba(255,255,255,.04);color:var(--text)}
.node-col-row.col-hl{background:rgba(56,139,253,.1);color:var(--blue)}
.ncol-icon{font-size:10px;width:12px;text-align:center;flex-shrink:0}
.ncol-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ncol-type{font-family:monospace;font-size:9px;color:var(--text-dim);flex-shrink:0;margin-left:auto}
.node-more{padding:3px 10px 5px;font-size:10px;color:var(--text-dim);cursor:pointer}
.node-more:hover{color:var(--blue)}

/* ── DETAIL PANEL ── */
#detail{width:0;background:var(--surface);border-left:1px solid var(--border);overflow:hidden;transition:width .22s cubic-bezier(.4,0,.2,1);flex-shrink:0}
#detail.open{width:292px}
#detail-inner{width:292px;height:100%;overflow-y:auto;padding:16px 14px}
.det-close{float:right;margin-top:-2px;background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:20px;line-height:1;padding:0}
.det-close:hover{color:var(--text)}
.det-heading{font-size:14px;font-weight:700;margin-bottom:2px;font-family:monospace;word-break:break-all;padding-right:22px}
.det-sub{font-size:11px;color:var(--text-muted);margin-bottom:12px;word-break:break-all}
.det-badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.det-badge{font-size:10px;padding:3px 7px;border-radius:5px;font-weight:600}
.det-section{margin-bottom:16px}
.det-section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);margin-bottom:7px;padding-bottom:5px;border-bottom:1px solid var(--border-light)}
.det-stat{display:flex;justify-content:space-between;padding:3px 0;font-size:12px}
.det-stat .k{color:var(--text-muted)}.det-stat .v{color:var(--text);font-weight:500}
.det-col{padding:6px 0;border-bottom:1px solid var(--border-light);display:flex;gap:7px;align-items:flex-start}
.det-col:last-child{border-bottom:none}
.det-col-info{flex:1}
.det-col-name{font-size:12px;font-family:monospace;color:var(--text)}
.det-col-type{font-size:10px;color:var(--text-dim);margin-top:1px}
.det-col-src{font-size:10px;color:var(--text-dim);margin-top:2px}
.det-col-src span{color:var(--blue)}
.det-lineage-node{padding:5px 7px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);cursor:pointer;border-radius:5px;transition:background .1s}
.det-lineage-node:hover{background:var(--surface-2);color:var(--text)}

/* ── EDGES ── */
.e-hit{fill:none;stroke:transparent;stroke-width:12;cursor:pointer;pointer-events:stroke}
.e-visual{fill:none;stroke:#30363D;stroke-width:1.5;pointer-events:none;transition:stroke .2s,stroke-width .2s,opacity .2s}
.e-visual.e-hl{stroke:var(--blue);stroke-width:2;opacity:1}
.e-visual.e-dim{opacity:.07}
.e-hit:hover ~ .e-visual,.e-hit.hover ~ .e-visual{stroke:rgba(56,139,253,.6);stroke-width:2}

/* ── CORNER CONTROLS ── */
#zoom-btns{position:absolute;bottom:16px;right:16px;display:flex;flex-direction:column;gap:2px;z-index:50}
.z-btn{width:30px;height:30px;background:var(--surface);border:1px solid var(--border);border-radius:7px;color:var(--text-muted);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .1s;user-select:none}
.z-btn:hover{background:var(--surface-2);color:var(--text)}

#minimap{position:absolute;bottom:104px;right:16px;width:148px;height:80px;background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;z-index:50;cursor:pointer}
#minimap canvas{width:100%;height:100%;display:block}

/* ── TOOLTIP ── */
#tip{position:fixed;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:6px 9px;font-size:11px;pointer-events:none;z-index:9999;display:none;max-width:220px;line-height:1.5;box-shadow:0 4px 16px rgba(0,0,0,.4)}
#tip.vis{display:block}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ── COLUMN LINEAGE LINES (drawn in SVG layer) ── */
.col-edge{fill:none;stroke:rgba(56,139,253,.5);stroke-width:1;stroke-dasharray:4 3;pointer-events:none}
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="top-bar">
  <div class="logo">
    <div class="logo-mark">◈</div>
    Lineage
  </div>
  <div class="vr"></div>
  <div class="breadcrumb">
    <span class="bc-item">prod_db</span>
    <span class="bc-sep">/</span>
    <span class="bc-item">All schemas</span>
    <span class="bc-sep">/</span>
    <span class="bc-cur">Full graph</span>
  </div>
  <div id="search-wrap">
    <span class="search-ico">⌕</span>
    <input id="search-input" type="text" placeholder="Search tables, columns, schemas…" autocomplete="off" spellcheck="false">
    <span class="kbd">⌘K</span>
    <div id="search-results"></div>
  </div>
  <div class="chips" id="chips">
    <div class="chip on" data-filter="all">All</div>
    <div class="chip" data-filter="0"><span class="chip-dot" style="background:#388BFD"></span>Sources</div>
    <div class="chip" data-filter="1"><span class="chip-dot" style="background:#A371F7"></span>Staging</div>
    <div class="chip" data-filter="2"><span class="chip-dot" style="background:#39C5CF"></span>Intermediate</div>
    <div class="chip" data-filter="3"><span class="chip-dot" style="background:#3FB950"></span>Marts</div>
    <div class="chip" data-filter="4"><span class="chip-dot" style="background:#E3B341"></span>Reporting</div>
  </div>
</div>

<!-- MAIN LAYOUT -->
<div id="layout">
  <div id="left-panel"></div>
  <div id="graph-area">
    <div id="canvas">
      <svg id="edges-svg"></svg>
    </div>
    <div id="zoom-btns">
      <div class="z-btn" id="z-in" title="Zoom in">+</div>
      <div class="z-btn" id="z-out" title="Zoom out">−</div>
      <div class="z-btn" id="z-reset" title="Reset view" style="font-size:11px">⊡</div>
    </div>
    <div id="minimap"><canvas id="mm-canvas"></canvas></div>
  </div>
  <div id="detail"><div id="detail-inner"></div></div>
</div>

<div id="tip"></div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════════════

const LAYERS = [
  {id:'raw',       label:'Raw Sources',  color:'#388BFD'},
  {id:'staging',   label:'Staging',      color:'#A371F7'},
  {id:'int',       label:'Intermediate', color:'#39C5CF'},
  {id:'marts',     label:'Marts',        color:'#3FB950'},
  {id:'reporting', label:'Reporting',    color:'#E3B341'},
];

const NODES = [
  // ── RAW ──────────────────────────────────────────────────
  {id:'raw_orders',    layer:0, label:'orders',    schema:'raw',        db:'prod_db',  type:'source', rows:'12.4M', updated:'2h ago',  fresh:true,
   cols:[{n:'order_id',t:'STRING',k:true},{n:'customer_id',t:'STRING'},{n:'created_at',t:'TIMESTAMP'},{n:'status',t:'STRING'},{n:'amount',t:'NUMERIC'},{n:'currency',t:'STRING'},{n:'channel',t:'STRING'}]},
  {id:'raw_customers', layer:0, label:'customers', schema:'raw',        db:'prod_db',  type:'source', rows:'890K',  updated:'2h ago',  fresh:true,
   cols:[{n:'customer_id',t:'STRING',k:true},{n:'email',t:'STRING'},{n:'full_name',t:'STRING'},{n:'created_at',t:'TIMESTAMP'},{n:'country',t:'STRING'},{n:'plan',t:'STRING'}]},
  {id:'raw_products',  layer:0, label:'products',  schema:'raw',        db:'prod_db',  type:'source', rows:'45K',   updated:'6h ago',  fresh:false,
   cols:[{n:'product_id',t:'STRING',k:true},{n:'name',t:'STRING'},{n:'category',t:'STRING'},{n:'price',t:'NUMERIC'},{n:'sku',t:'STRING'}]},
  {id:'raw_payments',  layer:0, label:'payments',  schema:'stripe',     db:'fivetran', type:'source', rows:'15.1M', updated:'1h ago',  fresh:true,
   cols:[{n:'payment_id',t:'STRING',k:true},{n:'order_id',t:'STRING'},{n:'amount',t:'NUMERIC'},{n:'status',t:'STRING'},{n:'gateway',t:'STRING'},{n:'created_at',t:'TIMESTAMP'}]},
  {id:'raw_accounts',  layer:0, label:'accounts',  schema:'salesforce', db:'fivetran', type:'source', rows:'234K',  updated:'4h ago',  fresh:true,
   cols:[{n:'account_id',t:'STRING',k:true},{n:'name',t:'STRING'},{n:'type',t:'STRING'},{n:'arr',t:'NUMERIC'},{n:'csm_id',t:'STRING'}]},

  // ── STAGING ──────────────────────────────────────────────
  {id:'stg_orders',    layer:1, label:'stg_orders',    schema:'staging', db:'prod_db', type:'model', rows:'12.4M', updated:'1.5h ago', fresh:true,
   cols:[{n:'order_id',t:'STRING',k:true},{n:'customer_id',t:'STRING'},{n:'created_at',t:'TIMESTAMP'},{n:'status',t:'STRING'},{n:'amount_usd',t:'NUMERIC'},{n:'channel',t:'STRING'}]},
  {id:'stg_customers', layer:1, label:'stg_customers', schema:'staging', db:'prod_db', type:'model', rows:'890K',  updated:'1.5h ago', fresh:true,
   cols:[{n:'customer_id',t:'STRING',k:true},{n:'email',t:'STRING'},{n:'full_name',t:'STRING'},{n:'country_code',t:'STRING'},{n:'plan',t:'STRING'}]},
  {id:'stg_products',  layer:1, label:'stg_products',  schema:'staging', db:'prod_db', type:'model', rows:'45K',   updated:'5.5h ago', fresh:false,
   cols:[{n:'product_id',t:'STRING',k:true},{n:'name',t:'STRING'},{n:'category',t:'STRING'},{n:'price_usd',t:'NUMERIC'}]},
  {id:'stg_payments',  layer:1, label:'stg_payments',  schema:'staging', db:'prod_db', type:'model', rows:'15.1M', updated:'0.5h ago', fresh:true,
   cols:[{n:'payment_id',t:'STRING',k:true},{n:'order_id',t:'STRING'},{n:'amount_usd',t:'NUMERIC'},{n:'is_paid',t:'BOOLEAN'},{n:'gateway',t:'STRING'}]},
  {id:'stg_accounts',  layer:1, label:'stg_accounts',  schema:'staging', db:'prod_db', type:'model', rows:'234K',  updated:'3.5h ago', fresh:true,
   cols:[{n:'account_id',t:'STRING',k:true},{n:'account_name',t:'STRING'},{n:'arr',t:'NUMERIC'},{n:'account_type',t:'STRING'}]},

  // ── INTERMEDIATE ─────────────────────────────────────────
  {id:'int_order_items',     layer:2, label:'int_order_items',     schema:'intermediate', db:'prod_db', type:'model', rows:'18.7M', updated:'1h ago', fresh:true,
   cols:[{n:'order_item_id',t:'STRING',k:true},{n:'order_id',t:'STRING'},{n:'product_id',t:'STRING'},{n:'quantity',t:'INTEGER'},{n:'unit_price_usd',t:'NUMERIC'},{n:'line_total_usd',t:'NUMERIC'}]},
  {id:'int_customer_orders', layer:2, label:'int_customer_orders', schema:'intermediate', db:'prod_db', type:'model', rows:'890K',  updated:'1h ago', fresh:true,
   cols:[{n:'customer_id',t:'STRING',k:true},{n:'lifetime_value',t:'NUMERIC'},{n:'order_count',t:'INTEGER'},{n:'first_order_at',t:'TIMESTAMP'},{n:'last_order_at',t:'TIMESTAMP'},{n:'avg_order_value',t:'NUMERIC'}]},
  {id:'int_payment_enriched',layer:2, label:'int_payment_enriched',schema:'intermediate', db:'prod_db', type:'model', rows:'15.1M', updated:'1h ago', fresh:true,
   cols:[{n:'payment_id',t:'STRING',k:true},{n:'order_id',t:'STRING'},{n:'customer_id',t:'STRING'},{n:'amount_usd',t:'NUMERIC'},{n:'is_paid',t:'BOOLEAN'},{n:'gateway',t:'STRING'}]},

  // ── MARTS ────────────────────────────────────────────────
  {id:'fct_orders',    layer:3, label:'fct_orders',    schema:'marts', db:'prod_db', type:'mart', rows:'12.4M', updated:'45m ago', fresh:true,
   cols:[{n:'order_id',t:'STRING',k:true},{n:'customer_id',t:'STRING'},{n:'order_date',t:'DATE'},{n:'status',t:'STRING'},{n:'gmv_usd',t:'NUMERIC'},{n:'is_returned',t:'BOOLEAN'},{n:'channel',t:'STRING'}]},
  {id:'dim_customers', layer:3, label:'dim_customers', schema:'marts', db:'prod_db', type:'mart', rows:'890K',  updated:'45m ago', fresh:true,
   cols:[{n:'customer_id',t:'STRING',k:true},{n:'email',t:'STRING'},{n:'segment',t:'STRING'},{n:'ltv_usd',t:'NUMERIC'},{n:'country',t:'STRING'},{n:'plan',t:'STRING'},{n:'is_churned',t:'BOOLEAN'}]},
  {id:'dim_products',  layer:3, label:'dim_products',  schema:'marts', db:'prod_db', type:'mart', rows:'45K',   updated:'5h ago',  fresh:false,
   cols:[{n:'product_id',t:'STRING',k:true},{n:'name',t:'STRING'},{n:'category',t:'STRING'},{n:'price_tier',t:'STRING'},{n:'brand',t:'STRING'}]},

  // ── REPORTING ────────────────────────────────────────────
  {id:'revenue_dash',   layer:4, label:'Revenue Dashboard', schema:'looker',  db:'bi_layer', type:'report', rows:null, updated:'30m ago', fresh:true,
   cols:[{n:'gmv',t:'MEASURE'},{n:'order_count',t:'MEASURE'},{n:'aov',t:'MEASURE'},{n:'date',t:'DIMENSION'},{n:'channel',t:'DIMENSION'}]},
  {id:'customer_360',   layer:4, label:'Customer 360',      schema:'looker',  db:'bi_layer', type:'report', rows:null, updated:'30m ago', fresh:true,
   cols:[{n:'customer_count',t:'MEASURE'},{n:'ltv_avg',t:'MEASURE'},{n:'segment',t:'DIMENSION'},{n:'churn_rate',t:'MEASURE'}]},
  {id:'product_report', layer:4, label:'Product Analytics', schema:'tableau', db:'bi_layer', type:'report', rows:null, updated:'2h ago',  fresh:false,
   cols:[{n:'product_name',t:'DIMENSION'},{n:'category',t:'DIMENSION'},{n:'revenue',t:'MEASURE'},{n:'units_sold',t:'MEASURE'}]},
];

const EDGES = [
  // raw → staging
  {f:'raw_orders',    t:'stg_orders'},
  {f:'raw_customers', t:'stg_customers'},
  {f:'raw_products',  t:'stg_products'},
  {f:'raw_payments',  t:'stg_payments'},
  {f:'raw_accounts',  t:'stg_accounts'},
  // staging → intermediate
  {f:'stg_orders',    t:'int_order_items'},
  {f:'stg_products',  t:'int_order_items'},
  {f:'stg_orders',    t:'int_customer_orders'},
  {f:'stg_customers', t:'int_customer_orders'},
  {f:'stg_payments',  t:'int_payment_enriched'},
  {f:'stg_customers', t:'int_payment_enriched'},
  // intermediate → marts
  {f:'int_order_items',      t:'fct_orders'},
  {f:'int_payment_enriched', t:'fct_orders'},
  {f:'int_customer_orders',  t:'dim_customers'},
  {f:'stg_accounts',         t:'dim_customers'},
  {f:'stg_products',         t:'dim_products'},
  // marts → reporting
  {f:'fct_orders',    t:'revenue_dash'},
  {f:'dim_customers', t:'revenue_dash'},
  {f:'fct_orders',    t:'customer_360'},
  {f:'dim_customers', t:'customer_360'},
  {f:'fct_orders',    t:'product_report'},
  {f:'dim_products',  t:'product_report'},
];

// Column-level lineage (simplified subset)
const COL_EDGES = [
  {f:'raw_orders.order_id',     t:'stg_orders.order_id'},
  {f:'raw_orders.customer_id',  t:'stg_orders.customer_id'},
  {f:'raw_orders.amount',       t:'stg_orders.amount_usd',    note:'currency_convert()'},
  {f:'raw_orders.channel',      t:'stg_orders.channel'},
  {f:'raw_customers.customer_id',t:'stg_customers.customer_id'},
  {f:'raw_customers.email',     t:'stg_customers.email'},
  {f:'stg_orders.order_id',     t:'int_order_items.order_id'},
  {f:'stg_orders.customer_id',  t:'int_customer_orders.customer_id'},
  {f:'stg_customers.customer_id',t:'int_customer_orders.customer_id'},
  {f:'stg_payments.order_id',   t:'int_payment_enriched.order_id'},
  {f:'stg_customers.customer_id',t:'int_payment_enriched.customer_id'},
  {f:'int_order_items.order_id', t:'fct_orders.order_id'},
  {f:'int_payment_enriched.is_paid',t:'fct_orders.is_returned'},

  {f:'fct_orders.gmv_usd',      t:'revenue_dash.gmv'},
  {f:'fct_orders.order_id',     t:'revenue_dash.order_count', note:'COUNT(DISTINCT)'},
];

// ═══════════════════════════════════════════════════════════
// LAYOUT
// ═══════════════════════════════════════════════════════════

const NODE_W    = 204;
const LAYER_W   = 270;   // gap between layer centers
const LAYER_X0  = 180;   // first layer center x
const NODE_H    = 66;    // collapsed node height
const COL_H     = 24;    // height per column row
const COLS_DEF  = 4;     // columns shown when expanded (before "more")
const ROW_GAP   = 18;    // gap between nodes vertically
const GRAPH_TOP = 70;    // top margin for layer labels

const nodeById = {};
NODES.forEach(n => { nodeById[n.id] = n; });

// Group by layer
const byLayer = {};
NODES.forEach(n => {
  if (!byLayer[n.layer]) byLayer[n.layer] = [];
  byLayer[n.layer].push(n);
});

// Assign x/y
NODES.forEach(n => {
  const group = byLayer[n.layer];
  const idx   = group.indexOf(n);
  const count = group.length;
  const totalH = count * NODE_H + (count - 1) * ROW_GAP;
  const startY = GRAPH_TOP + 60 + Math.max(0, (460 - totalH) / 2);
  n.x = LAYER_X0 + n.layer * LAYER_W;
  n.y = startY + idx * (NODE_H + ROW_GAP);
  n.baseY = n.y;
});

const CANVAS_W = LAYER_X0 + 4 * LAYER_W + 200;
const CANVAS_H = 800;

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════

const S = {
  expanded:     new Set(),
  selNode:      null,
  hoverNode:    null,
  hoverEdge:    null,
  hoverCol:     null,   // 'nodeId.colName'
  filter:       'all',
  query:        '',
  scale:        1,
  ox:           50,
  oy:           30,
};

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════

function layerColor(l) { return LAYERS[l].color; }

function nodeH(n) {
  if (!S.expanded.has(n.id)) return NODE_H;
  const shown = Math.min(n.cols.length, COLS_DEF);
  const hasMore = n.cols.length > COLS_DEF;
  return NODE_H + 5 + shown * COL_H + (hasMore ? 20 : 4);
}

function upstream(id, acc = new Set()) {
  EDGES.filter(e => e.t === id).forEach(e => {
    if (!acc.has(e.f)) { acc.add(e.f); upstream(e.f, acc); }
  });
  return acc;
}

function downstream(id, acc = new Set()) {
  EDGES.filter(e => e.f === id).forEach(e => {
    if (!acc.has(e.t)) { acc.add(e.t); downstream(e.t, acc); }
  });
  return acc;
}

function related(id) {
  const up   = upstream(id);
  const down = downstream(id);
  return new Set([id, ...up, ...down]);
}

function edgeKey(e) { return e.f + '→' + e.t; }

function visibleNodes() {
  return NODES.filter(n => S.filter === 'all' || n.layer === +S.filter);
}

// Adjust Y positions so expanded nodes push siblings down
function computeY() {
  Object.keys(byLayer).forEach(layer => {
    const group = byLayer[layer];
    let y = group[0].baseY;
    group.forEach(n => {
      n.y = y;
      y += nodeH(n) + ROW_GAP;
    });
  });
}

// ═══════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════

const canvas       = document.getElementById('canvas');
const edgesSvg     = document.getElementById('edges-svg');
const graphArea    = document.getElementById('graph-area');

// Full structural render — only for expand/collapse, filter changes, and init.
// Never call this from hover handlers.
function render() {
  computeY();
  renderEdges();
  renderLayerLabels();
  renderNodes();
  applyFocusState();   // restore visual state on newly-created elements
  applyColHighlight(); // restore col highlight on newly-created elements
  renderMinimap();
  applyTransform();
}

function applyTransform() {
  canvas.style.transform = `translate(${S.ox}px,${S.oy}px) scale(${S.scale})`;
}

// ── FOCUS STATE (hover / selection) ──────────────────────
// Toggles CSS classes on *existing* DOM elements — no rebuild.
// Safe to call from mouseenter/mouseleave.
function applyFocusState() {
  const focusId = S.hoverNode || S.selNode;
  const relSet  = focusId ? related(focusId) : null;
  const query   = S.query.trim().toLowerCase();

  canvas.querySelectorAll('.node').forEach(el => {
    const id = el.dataset.id;
    if (!id) return;
    const n      = nodeById[id];
    const isSel  = id === S.selNode;
    const isRel  = !!(relSet && relSet.has(id));
    const pathDim = !!(relSet && !relSet.has(id));
    const qDim   = !!(query && !n.label.toLowerCase().includes(query)
                   && !n.schema.toLowerCase().includes(query)
                   && !n.cols.some(c => c.n.toLowerCase().includes(query)));
    el.classList.toggle('sel', isSel);
    el.classList.toggle('hl',  isRel && !isSel);
    el.classList.toggle('dim', pathDim || qDim);
  });

  edgesSvg.querySelectorAll('.edge-g').forEach(g => {
    const f   = g.dataset.f, t = g.dataset.t, key = g.dataset.key;
    const isHl  = !!(relSet && relSet.has(f) && relSet.has(t)) || S.hoverEdge === key;
    const isDim = !!(relSet && (!relSet.has(f) || !relSet.has(t))) && S.hoverEdge !== key;
    const vis = g.querySelector('.e-visual');
    if (!vis) return;
    vis.classList.toggle('e-hl',  isHl);
    vis.classList.toggle('e-dim', isDim);
    vis.setAttribute('marker-end', `url(#${isHl ? 'arr-hl' : 'arr'})`);
  });
}

// ── COL HIGHLIGHT ─────────────────────────────────────────
// Toggles col-hl classes and updates col-edge SVG paths in place.
function applyColHighlight() {
  const colKey = S.hoverCol;

  canvas.querySelectorAll('.node-col-row').forEach(el => {
    const key    = el.dataset.colkey;
    const isHl   = key === colKey;
    const isRel  = !!(colKey && COL_EDGES.some(
      ce => (ce.f === key && ce.t === colKey) || (ce.t === key && ce.f === colKey)
    ));
    el.classList.toggle('col-hl', isHl || isRel);
  });

  // Remove old col-edge paths then re-draw if needed
  edgesSvg.querySelectorAll('.col-edge').forEach(el => el.remove());
  if (!colKey) return;

  COL_EDGES.filter(ce => ce.f === colKey || ce.t === colKey).forEach(ce => {
    const [fn2, fc] = ce.f.split('.');
    const [tn2, tc] = ce.t.split('.');
    const fromNode  = nodeById[fn2], toNode = nodeById[tn2];
    if (!fromNode || !toNode) return;
    if (!S.expanded.has(fn2) || !S.expanded.has(tn2)) return;
    const fIdx = fromNode.cols.findIndex(c => c.n === fc);
    const tIdx = toNode.cols.findIndex(c => c.n === tc);
    if (fIdx < 0 || fIdx >= COLS_DEF || tIdx < 0 || tIdx >= COLS_DEF) return;
    const x1 = fromNode.x + NODE_W / 2;
    const y1 = fromNode.y + NODE_H + 5 + fIdx * COL_H + COL_H / 2;
    const x2 = toNode.x  - NODE_W / 2;
    const y2 = toNode.y  + NODE_H + 5 + tIdx * COL_H + COL_H / 2;
    const mx = (x1 + x2) / 2;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('class', 'col-edge');
    path.setAttribute('d', `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
    edgesSvg.appendChild(path);
  });
}

// ── LEFT PANEL ACTIVE UPDATE ──────────────────────────────
// Toggles .active on tree items without rebuilding the panel.
function updateLeftPanelActive() {
  document.querySelectorAll('#left-panel .lp-table-node').forEach(el => {
    el.classList.toggle('active', el.dataset.id === S.selNode);
  });
}

// ── LAYER LABELS ─────────────────────────────────────────

function renderLayerLabels() {
  canvas.querySelectorAll('.layer-col').forEach(el => el.remove());
  LAYERS.forEach((layer, i) => {
    const el = document.createElement('div');
    el.className = 'layer-col';
    el.style.cssText = `left:${LAYER_X0 + i * LAYER_W}px;top:8px;transform:translateX(-50%)`;
    el.innerHTML = `
      <div class="layer-col-label" style="color:${layer.color};border-color:${layer.color}33;background:${layer.color}0f">
        <span style="width:6px;height:6px;border-radius:50%;background:${layer.color};flex-shrink:0"></span>
        ${layer.label}
      </div>
    `;
    canvas.appendChild(el);
  });
}

// ── EDGES ────────────────────────────────────────────────
// Builds SVG in neutral state. applyFocusState() stamps classes afterwards.

function renderEdges() {
  const vn = new Set(visibleNodes().map(n => n.id));
  edgesSvg.setAttribute('width',   CANVAS_W);
  edgesSvg.setAttribute('height',  CANVAS_H + 200);
  edgesSvg.setAttribute('viewBox', `0 0 ${CANVAS_W} ${CANVAS_H + 200}`);

  let paths = '';
  EDGES.forEach(e => {
    if (!vn.has(e.f) || !vn.has(e.t)) return;
    const fn = nodeById[e.f], tn = nodeById[e.t];
    const x1 = fn.x + NODE_W / 2 + 2;
    const y1 = fn.y + nodeH(fn) / 2;
    const x2 = tn.x - NODE_W / 2 - 2;
    const y2 = tn.y + nodeH(tn) / 2;
    const mx = (x1 + x2) / 2;
    const d  = `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`;
    const key = edgeKey(e);
    paths += `<g class="edge-g" data-key="${key}" data-f="${e.f}" data-t="${e.t}">
      <path class="e-hit" d="${d}"/>
      <path class="e-visual" d="${d}" marker-end="url(#arr)"/>
    </g>`;
  });

  edgesSvg.innerHTML = `<defs>
    <marker id="arr"    markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#484F58"/></marker>
    <marker id="arr-hl" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#388BFD"/></marker>
  </defs>${paths}`;

  // Edge hover: toggle class on the group directly, no DOM rebuild
  edgesSvg.querySelectorAll('.edge-g').forEach(g => {
    const hit = g.querySelector('.e-hit');
    hit.addEventListener('mouseenter', evt => {
      S.hoverEdge = g.dataset.key;
      showTip(evt, `<b>${nodeById[g.dataset.f].label}</b> → <b>${nodeById[g.dataset.t].label}</b>`);
      applyFocusState();
    });
    hit.addEventListener('mousemove', moveTip);
    hit.addEventListener('mouseleave', () => {
      S.hoverEdge = null;
      hideTip();
      applyFocusState();
    });
  });
}

// ── NODES ────────────────────────────────────────────────
// Builds node DOM in neutral state. applyFocusState() stamps visual classes.

function renderNodes() {
  canvas.querySelectorAll('.node').forEach(el => el.remove());

  visibleNodes().forEach(n => {
    const exp   = S.expanded.has(n.id);
    const h     = nodeH(n);
    const color = layerColor(n.layer);
    const moreCount = n.cols.length - COLS_DEF;

    const colRows = exp ? n.cols.slice(0, COLS_DEF).map(col => {
      const colKey = n.id + '.' + col.n;
      return `<div class="node-col-row" data-colkey="${colKey}">
        <span class="ncol-icon" style="${col.k ? 'color:var(--amber)' : ''}">${col.k ? '⚿' : '·'}</span>
        <span class="ncol-name">${col.n}</span>
        <span class="ncol-type">${col.t}</span>
      </div>`;
    }).join('') : '';

    const el = document.createElement('div');
    el.className = `node${exp ? ' expanded' : ''}`;
    el.dataset.id = n.id;
    el.style.cssText = `left:${n.x}px;top:${n.y}px;height:${h}px`;
    el.innerHTML = `
      <div class="node-head">
        <div class="node-badge" style="background:${color}"></div>
        <span class="node-name" title="${n.label}">${n.label}</span>
        <span class="node-chevron">▾</span>
      </div>
      <div class="node-meta">
        <span class="node-tag">${n.db}.${n.schema}</span>
        ${n.rows ? `<span class="node-tag">${n.rows}</span>` : ''}
        <span class="node-tag" style="${!n.fresh ? 'color:var(--amber)' : ''}">${n.updated}</span>
        <span class="node-freshness" style="background:${n.fresh ? 'var(--green)' : 'var(--amber)'}"></span>
      </div>
      ${exp ? `<div class="node-sep"></div><div class="node-cols">${colRows}${moreCount > 0 ? `<div class="node-more">+${moreCount} more columns</div>` : ''}</div>` : ''}
    `;

    // Click: select — just update classes, no DOM rebuild
    el.addEventListener('click', evt => {
      evt.stopPropagation();
      if (S.selNode === n.id) {
        S.selNode = null;
        closeDetail();
      } else {
        S.selNode = n.id;
        openDetail(n);
      }
      applyFocusState();
      updateLeftPanelActive();
    });

    // Chevron: expand/collapse — structural change, needs full render
    el.querySelector('.node-chevron').addEventListener('click', evt => {
      evt.stopPropagation();
      S.expanded.has(n.id) ? S.expanded.delete(n.id) : S.expanded.add(n.id);
      render();
    });

    // Hover: path trace — class toggle only, no DOM rebuild
    el.addEventListener('mouseenter', () => { S.hoverNode = n.id; applyFocusState(); });
    el.addEventListener('mouseleave', () => { S.hoverNode = null; applyFocusState(); });

    // Column hover: lineage highlight — class toggle + col-edge paths only
    el.querySelectorAll('.node-col-row').forEach(crow => {
      crow.addEventListener('mouseenter', evt => {
        evt.stopPropagation();
        S.hoverCol = crow.dataset.colkey;
        applyColHighlight();
      });
      crow.addEventListener('mouseleave', () => {
        S.hoverCol = null;
        applyColHighlight();
      });
    });

    canvas.appendChild(el);
  });
}

// ── MINIMAP ──────────────────────────────────────────────

function renderMinimap() {
  const mm   = document.getElementById('mm-canvas');
  const mw   = 148, mh = 80;
  mm.width = mw * devicePixelRatio;
  mm.height = mh * devicePixelRatio;
  const ctx  = mm.getContext('2d');
  ctx.scale(devicePixelRatio, devicePixelRatio);
  ctx.clearRect(0, 0, mw, mh);

  const scaleX = mw / CANVAS_W;
  const scaleY = mh / (CANVAS_H + 200);
  const sc     = Math.min(scaleX, scaleY) * 0.9;

  // Draw edges
  ctx.strokeStyle = '#30363D';
  ctx.lineWidth = 0.8;
  EDGES.forEach(e => {
    const fn = nodeById[e.f], tn = nodeById[e.t];
    ctx.beginPath();
    ctx.moveTo(fn.x * sc + 6, fn.y * sc + 4);
    ctx.lineTo(tn.x * sc + 6, tn.y * sc + 4);
    ctx.stroke();
  });

  // Draw nodes
  NODES.forEach(n => {
    ctx.fillStyle = layerColor(n.layer) + '88';
    ctx.fillRect(n.x * sc - 6 + 6, n.y * sc + 4, NODE_W * sc, NODE_H * sc * 0.5);
  });

  // Viewport rect
  const ga   = graphArea;
  const gaW  = ga.offsetWidth;
  const gaH  = ga.offsetHeight;
  const vx   = (-S.ox / S.scale) * sc + 6;
  const vy   = (-S.oy / S.scale) * sc + 4;
  const vw   = (gaW / S.scale) * sc;
  const vh   = (gaH / S.scale) * sc;
  ctx.strokeStyle = 'rgba(56,139,253,.7)';
  ctx.lineWidth = 1;
  ctx.strokeRect(vx, vy, vw, vh);
}

// ═══════════════════════════════════════════════════════════
// DETAIL PANEL
// ═══════════════════════════════════════════════════════════

    <div class="det-section">
      <div class="det-section-title">Columns (${n.cols.length})</div>
      ${n.cols.map(col => {
        const colKey  = n.id + '.' + col.n;
        const colSrcs = COL_EDGES.filter(ce => ce.t === colKey);
        return `<div class="det-col">

            <div class="det-col-name">${col.k ? '⚿ ' : ''}${col.n}</div>
            <div class="det-col-type">${col.t}</div>
            ${colSrcs.length ? `<div class="det-col-src">← <span>${colSrcs.map(ce => ce.f).join(', ')}</span></div>` : ''}
          </div>
        </div>`;
      }).join('')}
    </div>
  `;

  document.getElementById('det-close').addEventListener('click', () => {
    S.selNode = null;
    closeDetail();
    applyFocusState();
    updateLeftPanelActive();
  });

  inner.querySelectorAll('[data-goto]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.goto;
      S.selNode = id;
      openDetail(nodeById[id]);
      panToNode(nodeById[id]);
      applyFocusState();
      updateLeftPanelActive();
    });
  });
}

function closeDetail() {
  document.getElementById('detail').classList.remove('open');
}

function panToNode(n) {
  const gaW = graphArea.offsetWidth;
  const gaH = graphArea.offsetHeight;
  S.ox = gaW / 2 - n.x * S.scale;
  S.oy = gaH / 2 - n.y * S.scale - nodeH(n) * S.scale / 2;
  applyTransform();
}

// ═══════════════════════════════════════════════════════════
// SEARCH
// ═══════════════════════════════════════════════════════════

const searchInput   = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');
let srFocused = 0, srItems = [];

searchInput.addEventListener('input', () => {
  S.query = searchInput.value;
  const q = S.query.trim().toLowerCase();
  if (!q) { searchResults.classList.remove('open'); searchResults.innerHTML = ''; applyFocusState(); return; }
  applyFocusState(); // dim non-matching nodes without rebuilding DOM

  // Build results grouped: table matches, then column matches
  const tableMatches = NODES.filter(n =>
    n.label.toLowerCase().includes(q) || n.schema.toLowerCase().includes(q) || n.db.toLowerCase().includes(q)
  ).slice(0, 6);

  const colMatches = [];
  NODES.forEach(n => {
    n.cols.forEach(c => {
      if (c.n.toLowerCase().includes(q) && !tableMatches.includes(n)) {
        colMatches.push({node: n, col: c});
      }
    });
  });
  const colMatchesTrimmed = colMatches.slice(0, 4);

  if (!tableMatches.length && !colMatchesTrimmed.length) {
    searchResults.innerHTML = `<div class="sr-empty">No results for "${S.query}"</div>`;
    searchResults.classList.add('open');
    return;
  }

  srItems = [];
  let html = '';
  if (tableMatches.length) {
    html += `<div class="sr-group-label">Tables</div>`;
    tableMatches.forEach(n => {
      srItems.push({type:'node', id:n.id});
      html += `<div class="sr-item" data-id="${n.id}">
        <span class="sr-badge" style="background:${layerColor(n.layer)}20;color:${layerColor(n.layer)}">${LAYERS[n.layer].id}</span>
        <span class="sr-name">${highlight(n.label, q)}</span>
        <span class="sr-col" style="font-family:normal;color:var(--text-dim)">${n.db}.${n.schema}</span>
      </div>`;
    });
  }
  if (colMatchesTrimmed.length) {
    html += `<div class="sr-group-label">Columns</div>`;
    colMatchesTrimmed.forEach(({node:n, col:c}) => {
      srItems.push({type:'col', id:n.id, col:c.n});
      html += `<div class="sr-item" data-id="${n.id}" data-col="${c.n}">
        <span class="sr-badge" style="background:${layerColor(n.layer)}20;color:${layerColor(n.layer)}">${n.label}</span>
        <span class="sr-name">${highlight(c.n, q)}</span>
        <span class="sr-col">${c.t}</span>
      </div>`;
    });
  }

  searchResults.innerHTML = html;
  srFocused = 0;
  searchResults.classList.add('open');

  searchResults.querySelectorAll('.sr-item').forEach(el => {
    el.addEventListener('click', () => activateSearchResult(el.dataset.id, el.dataset.col));
  });
});

function highlight(text, q) {
  const i = text.toLowerCase().indexOf(q);
  if (i < 0) return text;
  return text.slice(0, i) + `<b style="color:var(--blue)">${text.slice(i, i + q.length)}</b>` + text.slice(i + q.length);
}

function activateSearchResult(id, col) {
  S.selNode = id;
  S.query = '';
  searchInput.value = '';
  searchResults.classList.remove('open');
  const n = nodeById[id];
  if (col && !S.expanded.has(id)) {
    S.expanded.add(id);
    panToNode(n);
    openDetail(n);
    render(); // expansion changes node height — structural render needed
  } else {
    panToNode(n);
    openDetail(n);
    applyFocusState();
    updateLeftPanelActive();
  }
}

searchInput.addEventListener('keydown', evt => {
  if (!searchResults.classList.contains('open')) return;
  const items = searchResults.querySelectorAll('.sr-item');
  if (evt.key === 'ArrowDown') { evt.preventDefault(); srFocused = (srFocused + 1) % items.length; items.forEach((el, i) => el.classList.toggle('focused', i === srFocused)); }
  if (evt.key === 'ArrowUp')   { evt.preventDefault(); srFocused = (srFocused - 1 + items.length) % items.length; items.forEach((el, i) => el.classList.toggle('focused', i === srFocused)); }
  if (evt.key === 'Enter')     { const fi = items[srFocused]; if (fi) activateSearchResult(fi.dataset.id, fi.dataset.col); }
  if (evt.key === 'Escape')    { searchResults.classList.remove('open'); searchInput.blur(); S.query=''; applyFocusState(); }
});

searchInput.addEventListener('focus', () => { if (S.query) searchResults.classList.add('open'); });
document.addEventListener('click', e => { if (!e.target.closest('#search-wrap')) searchResults.classList.remove('open'); });

// ⌘K shortcut
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); searchInput.focus(); searchInput.select(); }
  if (e.key === 'Escape' && !searchResults.classList.contains('open')) {
    S.selNode = null; closeDetail(); applyFocusState(); updateLeftPanelActive();
  }
});

// ═══════════════════════════════════════════════════════════
// FILTER CHIPS
// ═══════════════════════════════════════════════════════════

document.getElementById('chips').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  chip.classList.add('on');
  S.filter = chip.dataset.filter;
  render();
});

// ═══════════════════════════════════════════════════════════
// PAN + ZOOM
// ═══════════════════════════════════════════════════════════

let panning = false, px0 = 0, py0 = 0, ox0 = 0, oy0 = 0;

graphArea.addEventListener('mousedown', e => {
  if (e.target.closest('.node') || e.target.closest('#zoom-btns') || e.target.closest('#minimap')) return;
  panning = true; px0 = e.clientX; py0 = e.clientY; ox0 = S.ox; oy0 = S.oy;
  graphArea.classList.add('panning');
});
document.addEventListener('mousemove', e => {
  if (!panning) return;
  S.ox = ox0 + e.clientX - px0;
  S.oy = oy0 + e.clientY - py0;
  applyTransform();
  renderMinimap();
});
document.addEventListener('mouseup', () => { panning = false; graphArea.classList.remove('panning'); });

graphArea.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 0.92 : 1.09;
  const rect   = graphArea.getBoundingClientRect();
  const mx     = e.clientX - rect.left;
  const my     = e.clientY - rect.top;
  const ns     = Math.max(0.25, Math.min(2.5, S.scale * factor));
  S.ox = mx - (mx - S.ox) * (ns / S.scale);
  S.oy = my - (my - S.oy) * (ns / S.scale);
  S.scale = ns;
  applyTransform();
  renderMinimap();
}, {passive:false});

graphArea.addEventListener('click', e => {
  if (!e.target.closest('.node') && !e.target.closest('.e-hit')) {
    S.selNode = null; closeDetail(); applyFocusState(); updateLeftPanelActive();
  }
});

document.getElementById('z-in').addEventListener('click', () => { S.scale = Math.min(2.5, S.scale * 1.2); applyTransform(); renderMinimap(); });
document.getElementById('z-out').addEventListener('click', () => { S.scale = Math.max(0.25, S.scale / 1.2); applyTransform(); renderMinimap(); });
document.getElementById('z-reset').addEventListener('click', () => { S.scale = 1; S.ox = 50; S.oy = 30; applyTransform(); renderMinimap(); });

// Minimap click: pan
document.getElementById('minimap').addEventListener('click', e => {
  const rect = document.getElementById('minimap').getBoundingClientRect();
  const mx   = (e.clientX - rect.left) / rect.width;
  const my   = (e.clientY - rect.top)  / rect.height;
  const sc   = Math.min(148 / CANVAS_W, 80 / (CANVAS_H + 200)) * 0.9;
  S.ox = -(mx * CANVAS_W - graphArea.offsetWidth / 2) * S.scale;
  S.oy = -(my * (CANVAS_H + 200) - graphArea.offsetHeight / 2) * S.scale;
  applyTransform();
  renderMinimap();
});

// ═══════════════════════════════════════════════════════════
// LEFT PANEL TREE
// ═══════════════════════════════════════════════════════════

function renderLeftPanel() {
  const panel = document.getElementById('left-panel');

  // Group by db → schema → nodes
  const tree = {};
  NODES.forEach(n => {
    if (!tree[n.db]) tree[n.db] = {};
    if (!tree[n.db][n.schema]) tree[n.db][n.schema] = [];
    tree[n.db][n.schema].push(n);
  });

  let html = `
    <div class="lp-section">
      <div class="lp-title">Catalog</div>
      ${Object.entries(tree).map(([db, schemas]) => `
        <div class="lp-node" style="color:var(--text);font-weight:500">
          <span class="lp-toggle">▾</span>
          <span style="font-size:13px">🗄</span>
          <span>${db}</span>
          <span class="lp-count">${Object.values(schemas).flat().length}</span>
        </div>
        <div>
          ${Object.entries(schemas).map(([schema, nodes]) => `
            <div class="lp-node" style="padding-left:20px">
              <span class="lp-toggle">▾</span>
              <span>📁</span>
              <span>${schema}</span>
              <span class="lp-count">${nodes.length}</span>
            </div>
            <div class="lp-children">
              ${nodes.map(n => `
                <div class="lp-table-node ${S.selNode === n.id ? 'active' : ''}" data-id="${n.id}">
                  <div class="lp-dot" style="background:${layerColor(n.layer)}"></div>
                  <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:monospace;font-size:11px">${n.label}</span>
                </div>
              `).join('')}
            </div>
          `).join('')}
        </div>
      `).join('')}
    </div>
    <div class="lp-section">
      <div class="lp-title">Stats</div>
      <div class="lp-stat"><span class="k">Tables</span><span class="v">${NODES.length}</span></div>
      <div class="lp-stat"><span class="k">Edges</span><span class="v">${EDGES.length}</span></div>
      <div class="lp-stat"><span class="k">Layers</span><span class="v">${LAYERS.length}</span></div>
      <div class="lp-stat"><span class="k">Stale</span><span class="v" style="color:var(--amber)">${NODES.filter(n=>!n.fresh).length}</span></div>
    </div>
    <div class="lp-section">
      <div class="lp-title">Layers</div>
      ${LAYERS.map((l, i) => `
        <div class="lp-node" data-filter="${i}">
          <span class="lp-dot" style="background:${l.color};border-radius:50%"></span>
          <span>${l.label}</span>
          <span class="lp-count">${byLayer[i] ? byLayer[i].length : 0}</span>
        </div>
      `).join('')}
    </div>
  `;

  panel.innerHTML = html;

  panel.querySelectorAll('[data-id]').forEach(el => {
    el.addEventListener('click', () => {
      const n = nodeById[el.dataset.id];
      S.selNode = n.id;
      panToNode(n);
      openDetail(n);
      applyFocusState();
      updateLeftPanelActive();
    });
  });

  panel.querySelectorAll('[data-filter]').forEach(el => {
    el.addEventListener('click', () => {
      S.filter = el.dataset.filter;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
      const chip = document.querySelector(`.chip[data-filter="${S.filter}"]`);
      if (chip) chip.classList.add('on');
      render();
    });
  });
}

// ═══════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════

const tip = document.getElementById('tip');
function showTip(evt, html) { tip.innerHTML = html; tip.classList.add('vis'); moveTip(evt); }
function moveTip(evt) { tip.style.left = (evt.clientX + 14) + 'px'; tip.style.top = (evt.clientY - 10) + 'px'; }
function hideTip() { tip.classList.remove('vis'); }

// ═══════════════════════════════════════════════════════════

render();
renderLeftPanel();

setTimeout(() => {
  S.selNode = 'fct_orders';
  S.expanded.add('fct_orders');
  openDetail(nodeById['fct_orders']);
  render(); // structural: fct_orders is now expanded
}, 200);
</script>
