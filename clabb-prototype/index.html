<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clabb — Prototype</title>
</head>
<body>
<style>
  /* ============ page tokens (outer stage adapts to viewer theme) ============ */
  :root{
    --stage-bg:#ECE9E2;
    --stage-ink:#24211B;
    --stage-muted:#6E675C;
    --stage-card:#F6F4EF;
    --stage-line:#DDD8CE;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --stage-bg:#161A18;
      --stage-ink:#EDEAE3;
      --stage-muted:#9AA39D;
      --stage-card:#1E2421;
      --stage-line:#2C332F;
    }
  }
  :root[data-theme="dark"]{
    --stage-bg:#161A18; --stage-ink:#EDEAE3; --stage-muted:#9AA39D;
    --stage-card:#1E2421; --stage-line:#2C332F;
  }
  :root[data-theme="light"]{
    --stage-bg:#ECE9E2; --stage-ink:#24211B; --stage-muted:#6E675C;
    --stage-card:#F6F4EF; --stage-line:#DDD8CE;
  }

  /* ============ app tokens (the phone commits to one "studio daylight" look) ============ */
  :root{
    --pine:#22574A;
    --pine-deep:#1A443A;
    --pine-soft:#E3ECE7;
    --marigold:#E8A33D;
    --clay:#C4643B;
    --porcelain:#F6F4EF;
    --paper:#FFFFFF;
    --ink:#24211B;
    --muted:#6E675C;
    --line:#E6E1D7;
    --good:#2E7D4F;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    /* craft hues */
    --c-wood:#8A5A33; --c-paint:#3E6FA3; --c-ceramics:#B0563A; --c-fiber:#7A5EA6;
    --c-print:#2E7D6B; --c-jewelry:#A9822C; --c-photo:#556270; --c-leather:#6B4F3A;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--sans);
    background:var(--stage-bg);
    color:var(--stage-ink);
    -webkit-font-smoothing:antialiased;
  }

  /* ============ stage layout ============ */
  .stage{
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    gap:56px; padding:32px 24px;
  }
  .rail{
    max-width:300px; display:flex; flex-direction:column; gap:20px;
  }
  @media (max-width:900px){ .rail{display:none;} }
  .rail .wordmark{
    font-family:var(--serif); font-size:44px; font-weight:600; letter-spacing:-0.02em;
  }
  .rail .tagline{
    font-family:var(--serif); font-style:italic; font-size:17px; color:var(--stage-muted);
    margin-top:-10px;
  }
  .rail .railnote{ font-size:13px; line-height:1.55; color:var(--stage-muted); }
  .rail .flows{ display:flex; flex-direction:column; gap:8px; }
  .rail .flows button{
    text-align:left; font:inherit; font-size:13.5px; color:var(--stage-ink);
    background:var(--stage-card); border:1px solid var(--stage-line);
    border-radius:10px; padding:10px 14px; cursor:pointer;
  }
  .rail .flows button:hover{ border-color:var(--pine); }
  .rail .flows button b{ display:block; font-size:13.5px; }
  .rail .flows button span{ display:block; color:var(--stage-muted); font-size:12px; margin-top:2px; }
  .rail .eyebrow{
    font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--stage-muted);
  }

  /* ============ phone frame ============ */
  .phone{
    width:390px; height:812px; max-height:calc(100vh - 40px);
    background:var(--porcelain); color:var(--ink);
    border-radius:44px; border:10px solid #17201D;
    box-shadow:0 30px 80px rgba(0,0,0,0.35);
    overflow:hidden; position:relative;
    display:flex; flex-direction:column;
    flex-shrink:0;
  }
  .statusbar{
    height:44px; flex:none; display:flex; align-items:center; justify-content:space-between;
    padding:0 24px; font-size:13px; font-weight:600; background:var(--porcelain);
  }
  .screenhold{ flex:1; overflow:hidden; position:relative; }
  .screen{
    position:absolute; inset:0; overflow-y:auto; overscroll-behavior:contain;
    padding:0 0 24px; animation:slidein .22s ease;
    scrollbar-width:none;
  }
  .screen::-webkit-scrollbar{display:none;}
  @keyframes slidein{ from{transform:translateX(24px); opacity:0;} to{transform:none; opacity:1;} }
  @media (prefers-reduced-motion: reduce){
    .screen{animation:none;} .sheet{animation:none;} *{transition:none !important;}
  }

  /* ============ tab bar ============ */
  .tabbar{
    flex:none; display:grid; grid-template-columns:repeat(5,1fr);
    border-top:1px solid var(--line); background:var(--paper);
    padding:8px 6px 20px;
  }
  .tabbar button{
    font:inherit; background:none; border:0; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    font-size:10px; font-weight:600; letter-spacing:0.02em; color:var(--muted);
  }
  .tabbar button svg{ width:23px; height:23px; stroke:var(--muted); fill:none; stroke-width:1.7; }
  .tabbar button.on{ color:var(--pine); }
  .tabbar button.on svg{ stroke:var(--pine); }
  .tabbar .fab{
    margin-top:-22px; width:52px; height:52px; border-radius:50%;
    background:var(--pine); display:flex; align-items:center; justify-content:center;
    align-self:center; justify-self:center; box-shadow:0 6px 16px rgba(34,87,74,.35);
  }
  .tabbar .fab svg{ stroke:#fff; width:24px; height:24px; }

  /* ============ shared app pieces ============ */
  .apphead{
    padding:14px 20px 10px; display:flex; align-items:center; gap:12px;
  }
  .apphead h1{ font-family:var(--serif); font-size:26px; font-weight:600; letter-spacing:-0.01em; }
  .apphead .wordsm{ font-family:var(--serif); font-size:24px; font-weight:700; color:var(--pine); }
  .backbtn{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--line);
    background:var(--paper); cursor:pointer; flex:none;
    display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--ink);
  }
  .eyebrow{
    font-size:10.5px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted);
  }
  .pad{ padding:0 20px; }
  .btn{
    font:inherit; font-weight:600; font-size:15px; cursor:pointer;
    border-radius:12px; padding:14px 18px; border:0; width:100%;
    background:var(--pine); color:#fff;
  }
  .btn:active{ background:var(--pine-deep); }
  .btn:disabled{ opacity:.45; cursor:default; }
  .btn.ghost{ background:var(--paper); color:var(--pine); border:1.5px solid var(--pine); }
  .btn.sm{ width:auto; padding:9px 16px; font-size:13.5px; border-radius:10px; }
  .chip{
    font:inherit; font-size:12.5px; font-weight:600; cursor:pointer;
    padding:7px 13px; border-radius:999px; border:1px solid var(--line);
    background:var(--paper); color:var(--ink); white-space:nowrap;
  }
  .chip.on{ background:var(--pine); border-color:var(--pine); color:#fff; }
  .chiprow{ display:flex; gap:8px; overflow-x:auto; padding:10px 20px; scrollbar-width:none; }
  .chiprow::-webkit-scrollbar{display:none;}
  .chipwrap{ display:flex; gap:8px; flex-wrap:wrap; }

  .searchbar{
    margin:4px 20px 0; display:flex; align-items:center; gap:9px;
    background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:11px 14px;
  }
  .searchbar svg{ width:17px; height:17px; stroke:var(--muted); fill:none; stroke-width:2; flex:none; }
  .searchbar input{
    font:inherit; font-size:14.5px; border:0; outline:none; background:none; width:100%; color:var(--ink);
  }
  .searchbar input::placeholder{ color:var(--muted); }
  .filterbtn{
    flex:none; font:inherit; font-size:12.5px; font-weight:700; color:var(--pine);
    background:var(--pine-soft); border:0; border-radius:8px; padding:6px 11px; cursor:pointer;
  }

  /* cards */
  .card{
    background:var(--paper); border:1px solid var(--line); border-radius:16px;
    margin:0 20px 14px; overflow:hidden; cursor:pointer;
  }
  .card .tile{ height:120px; position:relative; }
  .card .body{ padding:13px 15px 15px; }
  .card h3{ font-size:15.5px; font-weight:700; line-height:1.3; margin:6px 0 3px; }
  .meta{ font-size:12.5px; color:var(--muted); line-height:1.5; }
  .cardtop{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .pricetag{
    font-size:12px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap;
  }
  .pricetag.free{ background:var(--pine-soft); color:var(--pine); }
  .pricetag.paid{ background:#F7E4D6; color:var(--clay); }
  .kindtag{
    position:absolute; left:10px; top:10px; font-size:10.5px; font-weight:700;
    letter-spacing:0.08em; text-transform:uppercase; color:#fff;
    background:rgba(23,32,29,.55); padding:4px 9px; border-radius:999px; backdrop-filter:blur(4px);
  }
  .spots{ position:absolute; right:10px; bottom:10px; font-size:11px; font-weight:700; color:#fff;
    background:rgba(23,32,29,.55); padding:4px 9px; border-radius:999px; }

  /* craft tiles (photo placeholders) */
  .tile{ display:flex; align-items:center; justify-content:center; }
  .tile svg.glyph{ width:44px; height:44px; stroke:rgba(255,255,255,.9); fill:none; stroke-width:1.5; }
  .t-wood{ background:linear-gradient(135deg,#8A5A33,#5C3A1E); }
  .t-paint{ background:linear-gradient(135deg,#3E6FA3,#274C74); }
  .t-ceramics{ background:linear-gradient(135deg,#B0563A,#7E3B26); }
  .t-fiber{ background:linear-gradient(135deg,#7A5EA6,#553F79); }
  .t-print{ background:linear-gradient(135deg,#2E7D6B,#1D554A); }
  .t-jewelry{ background:linear-gradient(135deg,#A9822C,#77591B); }
  .t-photo{ background:linear-gradient(135deg,#556270,#38434E); }
  .t-leather{ background:linear-gradient(135deg,#6B4F3A,#453222); }
  .tile::after{
    content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(45deg,transparent 0 14px,rgba(255,255,255,.045) 14px 15px);
  }

  .avatar{
    width:44px; height:44px; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:700; font-size:15px;
  }
  .avatar.lg{ width:64px; height:64px; font-size:21px; }
  .avatar.sm{ width:32px; height:32px; font-size:12px; }

  .stars{ color:var(--marigold); font-size:13px; letter-spacing:1px; }
  .ratingnum{ font-weight:700; font-size:13px; }
  .verified{
    display:inline-flex; align-items:center; gap:3px;
    font-size:10.5px; font-weight:700; color:var(--pine);
    background:var(--pine-soft); padding:2.5px 8px; border-radius:999px;
  }

  .seg{
    display:flex; gap:4px; margin:12px 20px 2px; background:var(--paper);
    border:1px solid var(--line); border-radius:11px; padding:4px;
  }
  .seg button{
    flex:1; font:inherit; font-size:12.5px; font-weight:600; padding:7px 4px;
    border:0; border-radius:8px; background:none; color:var(--muted); cursor:pointer;
  }
  .seg button.on{ background:var(--pine); color:#fff; }

  .listrow{
    display:flex; gap:12px; align-items:center; background:var(--paper);
    border:1px solid var(--line); border-radius:14px; margin:0 20px 11px;
    padding:13px 14px; cursor:pointer;
  }
  .listrow .grow{ flex:1; min-width:0; }
  .listrow h3{ font-size:14.5px; font-weight:700; }

  .sectionh{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:18px 20px 10px;
  }
  .sectionh h2{ font-family:var(--serif); font-size:19px; font-weight:600; }
  .sectionh a{ font-size:12.5px; font-weight:700; color:var(--pine); text-decoration:none; cursor:pointer; }

  /* detail screens */
  .hero{ height:190px; position:relative; }
  .hero .backbtn{ position:absolute; left:16px; top:14px; border:0; background:rgba(255,255,255,.92); z-index:2; }
  .hero .kindtag{ left:60px; top:20px; }
  .detailhead{ padding:16px 20px 6px; }
  .detailhead h1{ font-family:var(--serif); font-size:23px; line-height:1.2; font-weight:600; margin:6px 0 8px; }
  .factrow{
    display:flex; gap:11px; align-items:flex-start; padding:11px 20px;
  }
  .factrow svg{ width:18px; height:18px; stroke:var(--pine); fill:none; stroke-width:1.8; flex:none; margin-top:1px; }
  .factrow b{ font-size:13.5px; display:block; }
  .factrow span{ font-size:12.5px; color:var(--muted); }
  .divider{ height:1px; background:var(--line); margin:10px 20px; }
  .prose{ font-size:13.5px; line-height:1.65; color:#443F36; padding:4px 20px; }
  .stickycta{
    position:sticky; bottom:0; background:linear-gradient(to top,var(--porcelain) 75%,transparent);
    padding:14px 20px 6px; display:flex; gap:10px; align-items:center;
  }
  .stickycta .price{ flex:none; }
  .stickycta .price b{ font-family:var(--serif); font-size:21px; }
  .stickycta .price span{ display:block; font-size:11px; color:var(--muted); }

  .hostrow{ display:flex; align-items:center; gap:11px; padding:12px 20px; cursor:pointer; }
  .hostrow .grow{flex:1;}
  .hostrow b{ font-size:14px; display:block; }
  .hostrow span{ font-size:12px; color:var(--muted); display:block; }

  /* forms */
  .field{ padding:9px 20px; }
  .field label{ display:block; font-size:12px; font-weight:700; margin-bottom:6px; color:var(--ink); }
  .field input[type=text], .field input[type=number], .field textarea, .field select{
    width:100%; font:inherit; font-size:14.5px; color:var(--ink);
    background:var(--paper); border:1px solid var(--line); border-radius:11px; padding:12px 13px;
    outline:none;
  }
  .field textarea{ min-height:84px; resize:none; }
  .field input:focus, .field textarea:focus, .field select:focus{ border-color:var(--pine); }
  .hint{ font-size:11.5px; color:var(--muted); margin-top:5px; }
  .switchrow{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:13px 20px;
  }
  .switchrow b{ font-size:14px; display:block; }
  .switchrow span{ font-size:12px; color:var(--muted); display:block; margin-top:2px; }
  .switch{
    width:46px; height:27px; border-radius:999px; background:#D5D0C6; position:relative;
    cursor:pointer; flex:none; border:0; transition:background .15s;
  }
  .switch::after{
    content:""; position:absolute; width:21px; height:21px; border-radius:50%;
    background:#fff; top:3px; left:3px; transition:left .15s; box-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  .switch.on{ background:var(--pine); }
  .switch.on::after{ left:22px; }

  .typecard{
    display:flex; gap:13px; align-items:flex-start; background:var(--paper);
    border:1.5px solid var(--line); border-radius:15px; margin:0 20px 12px;
    padding:15px; cursor:pointer;
  }
  .typecard.on{ border-color:var(--pine); background:var(--pine-soft); }
  .typecard .ic{
    width:40px; height:40px; border-radius:11px; flex:none;
    display:flex; align-items:center; justify-content:center;
  }
  .typecard .ic svg{ width:21px; height:21px; stroke:#fff; fill:none; stroke-width:1.8; }
  .typecard b{ font-size:14.5px; display:block; }
  .typecard span{ font-size:12.5px; color:var(--muted); line-height:1.45; display:block; margin-top:3px; }

  /* sheets */
  .scrim{
    position:absolute; inset:0; background:rgba(23,32,29,.45); z-index:40;
    display:flex; align-items:flex-end; animation:fade .18s ease;
  }
  @keyframes fade{ from{opacity:0;} to{opacity:1;} }
  .sheet{
    background:var(--porcelain); width:100%; border-radius:22px 22px 0 0;
    max-height:88%; overflow-y:auto; padding-bottom:26px; animation:up .22s ease;
    scrollbar-width:none;
  }
  .sheet::-webkit-scrollbar{display:none;}
  @keyframes up{ from{transform:translateY(40px); opacity:.4;} to{transform:none; opacity:1;} }
  .sheethead{
    display:flex; align-items:center; justify-content:space-between; padding:18px 20px 8px;
  }
  .sheethead h2{ font-family:var(--serif); font-size:20px; font-weight:600; }
  .sheethead button{ font:inherit; background:none; border:0; font-size:13px; font-weight:700; color:var(--pine); cursor:pointer; }
  .grabber{ width:38px; height:4px; border-radius:2px; background:#D5D0C6; margin:10px auto 0; }

  .payrow{ display:flex; justify-content:space-between; font-size:13.5px; padding:7px 20px; color:#443F36; }
  .payrow.total{ font-weight:700; color:var(--ink); font-size:15px; }
  .payrow.total b{ font-family:var(--serif); font-size:18px; }
  .qty{ display:flex; align-items:center; gap:14px; }
  .qty button{
    width:32px; height:32px; border-radius:50%; border:1.5px solid var(--pine);
    background:none; color:var(--pine); font-size:17px; font-weight:700; cursor:pointer;
  }
  .qty b{ font-size:16px; min-width:18px; text-align:center; }
  .cardfield{
    display:flex; gap:10px; align-items:center; margin:8px 20px;
    background:var(--paper); border:1px solid var(--line); border-radius:11px; padding:12px 13px;
    font-size:14px; color:var(--muted);
  }

  /* success */
  .success{ text-align:center; padding:64px 32px 0; }
  .success .bigcheck{
    width:74px; height:74px; border-radius:50%; background:var(--pine-soft);
    display:flex; align-items:center; justify-content:center; margin:0 auto 20px;
  }
  .success .bigcheck svg{ width:34px; height:34px; stroke:var(--pine); stroke-width:2.4; fill:none; }
  .success h1{ font-family:var(--serif); font-size:25px; font-weight:600; margin-bottom:10px; }
  .success p{ font-size:13.5px; color:var(--muted); line-height:1.6; margin-bottom:26px; }

  /* mentor profile */
  .mentortop{ text-align:center; padding:8px 20px 4px; }
  .mentortop .avatar{ margin:0 auto 10px; }
  .mentortop h1{ font-family:var(--serif); font-size:23px; font-weight:600; }
  .mentortop .meta{ margin-top:3px; }
  .statgrid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:9px; padding:14px 20px 4px;
  }
  .stat{
    background:var(--paper); border:1px solid var(--line); border-radius:13px;
    text-align:center; padding:12px 6px;
  }
  .stat b{ font-family:var(--serif); font-size:19px; display:block; }
  .stat span{ font-size:10.5px; color:var(--muted); font-weight:600; letter-spacing:.04em; text-transform:uppercase; }
  .portgrid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:4px 20px;
  }
  .portgrid .tile{ height:104px; border-radius:11px; overflow:hidden; position:relative; }
  .portgrid .tile svg.glyph{ width:26px; height:26px; }
  .portgrid .tile em{
    position:absolute; left:7px; right:7px; bottom:6px; font-style:normal;
    font-size:9.5px; font-weight:700; color:#fff; line-height:1.25;
    text-shadow:0 1px 3px rgba(0,0,0,.5);
  }
  .rbar{ display:flex; align-items:center; gap:9px; padding:3px 20px; font-size:12px; color:var(--muted); }
  .rbar .track{ flex:1; height:6px; border-radius:3px; background:var(--line); overflow:hidden; }
  .rbar .fill{ height:100%; background:var(--marigold); border-radius:3px; }
  .review{
    background:var(--paper); border:1px solid var(--line); border-radius:14px;
    margin:0 20px 11px; padding:13px 15px;
  }
  .review .rhead{ display:flex; align-items:center; gap:10px; margin-bottom:7px; }
  .review .rhead b{ font-size:13px; display:block; }
  .review .rhead span{ font-size:11px; color:var(--muted); }
  .review p{ font-size:13px; line-height:1.55; color:#443F36; }
  .projtag{
    display:inline-block; margin-top:8px; font-size:10.5px; font-weight:700;
    color:var(--pine); background:var(--pine-soft); border-radius:999px; padding:3px 9px;
  }

  /* messages */
  .msgrow{ display:flex; gap:12px; align-items:center; padding:13px 20px; cursor:pointer; border-bottom:1px solid var(--line); }
  .msgrow .grow{ flex:1; min-width:0; }
  .msgrow b{ font-size:14px; }
  .msgrow p{ font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .msgrow time{ font-size:11px; color:var(--muted); flex:none; }
  .unread{ width:9px; height:9px; border-radius:50%; background:var(--clay); flex:none; }

  /* onboarding */
  .ob{ position:absolute; inset:0; background:var(--porcelain); z-index:60; display:flex; flex-direction:column; overflow-y:auto; }
  .ob .obinner{ flex:1; display:flex; flex-direction:column; padding:26px 26px 26px; }
  .ob .steps{ display:flex; gap:6px; margin-bottom:26px; }
  .ob .steps i{ height:4px; flex:1; border-radius:2px; background:var(--line); }
  .ob .steps i.on{ background:var(--pine); }
  .ob h1{ font-family:var(--serif); font-size:27px; font-weight:600; line-height:1.18; text-wrap:balance; margin-bottom:9px; }
  .ob .sub{ font-size:14px; color:var(--muted); line-height:1.6; margin-bottom:22px; }
  .obwelcome{ flex:1; display:flex; flex-direction:column; justify-content:center; text-align:center; padding:0 30px; }

/* =================== filtering =================== */
function filteredEvents(){
  const f = S.filters;
  return EVENTS.filter(e=>{
    if(f.kind!=='all' && e.kind!==f.kind) return false;
    if(f.craft && e.craftId!==f.craft) return false;
    if(f.price==='free' && !(e.price===0 || e.kind==='ask')) return false;
    if(f.price==='paid' && !(e.price>0)) return false;
    if(f.date==='week' && e.when.includes('Aug')) return false;
    if(f.date==='weekend' && !(e.when.startsWith('Sat')||e.when.startsWith('Sun')||e.when.includes('weekends'))) return false;
    if(f.q){
      const hay = (e.title+' '+craft(e.craftId).name+' '+e.host).toLowerCase();
      if(!hay.includes(f.q.toLowerCase())) return false;
    }
    return true;
  });
}
function activeFilterCount(){
  const f=S.filters; let n=0;
  if(f.craft)n++; if(f.date!=='any')n++; if(f.price!=='any')n++;
  return n;
}

  go('success', {title:'Request sent!', sub:m.name+' typically replies within a few hours. Once they accept, you’ll confirm timing and rate in chat — payment is only charged after the session.'});
}

/* =================== onboarding =================== */
function obHtml(){
  const ob = S.onboarding;
  if(ob.step===0){
    return '<div class="ob"><div class="obwelcome">'
      +'<div class="mark">Clabb</div>'
      +'<div class="tag">creative collaboration feeds the soul</div>'
      +'<p>Find classes, collab sessions, and one-on-one project help from makers near you — or share what you know.</p>'
      +'<button class="btn" onclick="S.onboarding.step=1;render()">Get started</button>'
      +'<button class="skiplink" onclick="finishOb()">Skip for now</button>'
      +'</div></div>';
  }
  if(ob.step===1){
    return '<div class="ob"><div class="obinner">'
      +'<div class="steps"><i class="on"></i><i></i></div>'
      +'<h1>What do you love to make?</h1>'
      +'<p class="sub">Pick a few crafts — we’ll use these to match you with events, collabs, and mentors.</p>'
      +'<div class="igrid">'+CRAFTS.map(c=>'<button class="interest '+(ob.interests.includes(c.id)?'on':'')+'" onclick="toggleInterest(\''+c.id+'\')"><span class="dot" style="background:'+c.hue+'"></span>'+c.name+'</button>').join('')+'</div>'
      +'<div class="field" style="padding:18px 0 0"><label>Where are you on the journey?</label>'
      +'<div class="chipwrap">'+['Curious beginner','Confident hobbyist','Seasoned maker','Professional'].map(s=>'<button class="chip '+(ob.skill===s?'on':'')+'" onclick="S.onboarding.skill=\''+s+'\';render()">'+s+'</button>').join('')+'</div></div>'
      +'<div style="flex:1"></div>'
      +'<button class="btn" style="margin-top:18px" '+(ob.interests.length?'':'disabled')+' onclick="if(S.onboarding.interests.length){S.onboarding.step=2;render()}">Continue</button>'
      +'</div></div>';
  }
  return '<div class="ob"><div class="obinner">'
    +'<div class="steps"><i class="on"></i><i class="on"></i></div>'
    +'<h1>Want to teach or mentor?</h1>'
    +'<p class="sub">If you’re open to working one-on-one with other makers, we’ll match you with project asks in your crafts. You choose what to charge — including nothing.</p>'
    +'<div class="switchrow" style="padding:4px 0 14px"><div><b>I’m available for mentoring</b><span>You can change this anytime in your profile</span></div>'
    +'<button class="switch '+(ob.mentorOn?'on':'')+'" role="switch" aria-checked="'+ob.mentorOn+'" onclick="S.onboarding.mentorOn=!S.onboarding.mentorOn;render()"></button></div>'
    +(ob.mentorOn
      ? '<div class="field" style="padding:0 0 8px"><label>How do you want to charge?</label>'
        +'<div class="chipwrap">'+[['hourly','Hourly rate'],['project','Per project'],['free','Free / donations']].map(r=>'<button class="chip '+(ob.rateType===r[0]?'on':'')+'" onclick="S.onboarding.rateType=\''+r[0]+'\';render()">'+r[1]+'</button>').join('')+'</div></div>'
        +(ob.rateType!=='free'
          ? '<div class="field" style="padding:0"><label>'+(ob.rateType==='hourly'?'Hourly rate (USD)':'Typical per-project rate (USD)')+'</label>'
            +'<input type="number" value="'+esc(ob.rate)+'" min="0" oninput="S.onboarding.rate=this.value">'
            +'<p class="hint">Shown on your mentor profile. You can adjust it for any individual offer.</p></div>'
          : '<p class="hint">You’ll be listed as a free mentor — seekers can leave optional donations.</p>')
      : '')
    +'<div style="flex:1"></div>'
    +'<button class="btn" style="margin-top:18px" onclick="finishOb()">Start exploring</button>'
    +'</div></div>';
}
function toggleInterest(id){
  const a = S.onboarding.interests;
  const i = a.indexOf(id);
  if(i>=0) a.splice(i,1); else a.push(id);
  render();
}
function finishOb(){
  const ob = S.onboarding;
  ob.done = true;
  S.me.mentorOn = ob.mentorOn; S.me.rateType = ob.rateType; S.me.rate = ob.rate;
  render();
  toast(ob.mentorOn ? 'Welcome to Clabb — you’re listed as a mentor' : 'Welcome to Clabb');
}

/* =================== render =================== */
const SCREENS = {
  discover: scrDiscover,
  eventDetail: scrEventDetail,
  mentors: scrMentors,
  mentorProfile: scrMentorProfile,
  create: scrCreate,
  createForm: scrCreateForm,
  messages: scrMessages,
  profile: scrProfile,
  success: scrSuccess,
};
const TABS = [
  ['discover','Discover','compass'],
  ['mentors','Mentors','award'],
  ['create','','plus'],
  ['messages','Messages','chat'],
  ['profile','Profile','user'],
];
function render(){
  const hold = $('#screenhold');
  const t = topScreen();
  let html = '<div class="screen" id="scr">'+SCREENS[t.n](t.arg)+'</div>';
  if(S.sheet){
    const sheets = {filters:sheetFilters, pay:sheetPay, offer:sheetOffer, request:sheetRequest};
    html += '<div class="scrim" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="grabber"></div>'+sheets[S.sheet.name](S.sheet.arg)+'</div></div>';
  }
  if(!S.onboarding.done) html += obHtml();
  hold.innerHTML = html;

  $('#tabbar').innerHTML = TABS.map(x=>{
    if(x[0]==='create')
      return '<button onclick="resetTab(\'create\')" aria-label="Create"><span class="fab">'+icon('plus')+'</span></button>';
    return '<button class="'+(S.tab===x[0]?'on':'')+'" onclick="resetTab(\''+x[0]+'\')">'+icon(x[2])+x[1]+'</button>';
  }).join('');

  const q = document.getElementById('q');
  if(q && S.filters.q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); }
}
render();
</script>

</body>
</html>
